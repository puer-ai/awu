<meta name="description" content="啊呜：揪出重复截图、滑一滑清废片、视频照片压一压。全部在手机本地完成，不上传任何照片。">
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="hero">
    <img class="icon" src="assets/icon.png" alt="啊呜的图标">
    <div>
      <h1>啊呜</h1>
      <p>专吃废片的小怪兽 · 相册清理</p>
    </div>
  </header>

  <img class="mascot" src="assets/awu.png" alt="紫色小怪兽啊呜">

  <div class="card tint-sunny">
    <h2>相册里的废片，交给啊呜吃掉</h2>
    <ul>
      <li><b>揪出重复</b>：一模一样的、只有一点点不同的截图、滚动截图、连拍相似照，一次揪出来。</li>
      <li><b>滑一滑</b>：上滑喂给啊呜，下滑留下来，还有大文件专场、糊片专场、那年今日。</li>
      <li><b>压一压</b>：视频、截图、大照片、实况照片压一压，画质几乎不变，空间省一大半。</li>
      <li><b>养成</b>：吃得越多，啊呜长得越大，5 种形态等你解锁。</li>
    </ul>
    <div class="chips">
      <span class="chip lime">全部在手机本地完成</span>
      <span class="chip sky">不上传任何照片</span>
      <span class="chip pink">删除可 30 天内找回</span>
    </div>
  </div>

  <div class="card">
    <h2>下载</h2>
    <p class="muted">即将在 App Store 上架。</p>
